name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install numpy pillow

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Syntax check
        run: npm run check

      - name: Fetch pinned catalogues
        run: npm run fetch

      - name: Build data and app
        run: npm run build:data && npm run build

      - name: Smoke test
        run: npm test

      - name: Render a preview
        if: always()
        run: node tools/screenshot.js horizon 1280 800 2026-08-12T22:00 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darksite-preview
          path: |
            shots/
            dist/index.html
          retention-days: 14
